services:
  - type: web
    name: brysonpaste
    env: node
    plan: free
    autoDeploy: true
    buildCommand: corepack enable && corepack prepare pnpm@10.33.2 --activate && pnpm install --frozen-lockfile && pnpm build
    startCommand: node apps/server/dist/bundle.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: NODE_VERSION
        value: 22.14.0
      - key: ALLOWED_ORIGINS
        value: "*"
