services:
  - type: web
    name: clipper-server
    env: node
    plan: free
    buildCommand: pnpm install && pnpm --filter @clipper/server build
    startCommand: node apps/server/dist/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: ALLOWED_ORIGINS
        sync: false
